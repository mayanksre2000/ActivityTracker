server:
  port: 8081
spring:
  application:
    name: user-service
  datasource:
    url : jdbc:mysql://localhost:3306/fitness_user_db
    username : root
    password : root

  jpa:
    hibernate:
      ddl-auto: update
      database-platform: org.hibernate.dialect.MySQL5Dialect
eureka :
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client :
    serviceUrl :
      defaultZone : http://localhost:8761/eureka/